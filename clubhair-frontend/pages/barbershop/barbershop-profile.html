<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../assets/css/barbershop-profile.css" />
    <title>Perfil da Barbearia</title>
  </head>
  <body>
    <div class="profile-container">
      <h2>Editar Perfil da Barbearia</h2>

      <div class="input-group">
        <label>Nome:</label>
        <input type="text" id="barbershopName" />
      </div>

      <div class="input-group">
        <label>Telefone:</label>
        <input type="text" id="barbershopPhone" />
      </div>

      <div class="input-group">
        <label>Endereço:</label>
        <input type="text" id="barbershopAddress" />
      </div>

      <button class="save-button">Salvar Alterações</button>
      <button class="delete-button">Excluir Barbearia</button>
      <button class="back-button">Voltar</button>
    </div>

    <script src="../../assets/js/barbershop-profile.js"></script>
  </body>
</html>
