<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../assets/css/barbershop-services.css" />
    <title>Gerenciar Serviços - Barbearia</title>
  </head>
  <body>
    <div class="services-container">
      <h1>💇‍♂️ Serviços da Barbearia</h1>

      <ul class="service-list"></ul>

      <div class="add-service">
        <h3>Adicionar Novo Serviço</h3>
        <input type="text" id="serviceName" placeholder="Nome do Serviço" />
        <input type="number" id="servicePrice" placeholder="Preço (R$)" />
        <input
          type="number"
          id="serviceDuration"
          placeholder="Duração (minutos)"
        />
        <button id="addServiceBtn">Adicionar</button>
      </div>

      <button class="back-button">Voltar</button>
    </div>

    <script src="../../assets/js/barbershop-services.js"></script>
  </body>
</html>
