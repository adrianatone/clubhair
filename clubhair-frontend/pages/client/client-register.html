<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cadastro de Cliente - ClubHair" />
    <title>Cadastro de Cliente - ClubHair</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: var(--spacing-md);
      }

      .register-container {
        background-color: var(--surface-color);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        padding: var(--spacing-2xl);
        max-width: 500px;
        width: 100%;
      }

      .register-header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
      }

      .register-logo {
        width: 60px;
        height: 60px;
        margin: 0 auto var(--spacing-xs);
      }

      .register-title {
        font-size: var(--text-2xl);
        color: var(--text-primary);
        margin-bottom: var(--spacing-sm);
      }

      .register-subtitle {
        color: var(--text-secondary);
        font-size: var(--text-sm);
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-xs);
        color: var(--text-secondary);
        font-size: var(--text-sm);
        margin-bottom: var(--spacing-lg);
        transition: color var(--transition-base);
      }

      .back-link:hover {
        color: var(--primary-color);
      }

      .register-footer {
        text-align: center;
        margin-top: var(--spacing-lg);
        padding-top: var(--spacing-lg);
        border-top: 1px solid var(--background-color);
        font-size: var(--text-sm);
        color: var(--text-secondary);
      }

      .register-footer a {
        color: var(--primary-color);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <a href="#main" class="skip-link">Pular para o conteúdo principal</a>

    <main id="main" class="register-container">
      <a href="../../index.html" class="back-link">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        Voltar
      </a>

      <header class="register-header">
        <img
          src="../../assets/images/logo.png"
          alt="Logo ClubHair"
          class="register-logo"
        />
        <h1 class="register-title">Cadastro de Cliente</h1>
        <p class="register-subtitle">Crie sua conta para agendar serviços</p>
      </header>

      <form id="registerForm" novalidate>
        <!-- Nome -->
        <div class="form-group">
          <label for="name" class="form-label required">Nome Completo</label>
          <div class="input-group">
            <i class="fas fa-user input-group-icon" aria-hidden="true"></i>
            <input
              type="text"
              id="name"
              name="name"
              class="form-input"
              placeholder="Digite seu nome completo"
              autocomplete="name"
              required
              aria-required="true"
            />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label required">Email</label>
          <div class="input-group">
            <i class="fas fa-envelope input-group-icon" aria-hidden="true"></i>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="seu@email.com"
              autocomplete="email"
              required
              aria-required="true"
            />
          </div>
        </div>

        <!-- Telefone -->
        <div class="form-group">
          <label for="phone" class="form-label required">Telefone</label>
          <div class="input-group">
            <i class="fas fa-phone input-group-icon" aria-hidden="true"></i>
            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-input"
              placeholder="(00) 00000-0000"
              autocomplete="tel"
              required
              aria-required="true"
            />
          </div>
          <span class="form-help">Digite apenas números</span>
        </div>

        <!-- Senha -->
        <div class="form-group">
          <label for="password" class="form-label required">Senha</label>
          <div class="input-group">
            <i class="fas fa-lock input-group-icon" aria-hidden="true"></i>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              required
              aria-required="true"
            />
          </div>
        </div>

        <!-- Confirmar Senha -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label required"
            >Confirmar Senha</label
          >
          <div class="input-group">
            <i class="fas fa-lock input-group-icon" aria-hidden="true"></i>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="Digite a senha novamente"
              autocomplete="new-password"
              required
              aria-required="true"
            />
          </div>
        </div>

        <!-- Botão de envio -->
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-user-plus" aria-hidden="true"></i>
          Cadastrar
        </button>
      </form>

      <footer class="register-footer">
        <p>Já tem uma conta? <a href="./client-login.html">Faça login</a></p>
      </footer>
    </main>

    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>

    <script>
      /**
       * Script de cadastro de cliente
       */

      const form = document.getElementById("registerForm");

      // Mascara de telefone
      const phoneInput = document.getElementById("phone");
      phoneInput.addEventListener("input", (e) => {
        let value = e.target.value.replace(/\D/g, "");
        if (value.length > 11) value = value.slice(0, 11);
        e.target.value = value;
      });

      // Submissão do formulário
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Validar formulário
        const isValid = UI.validateForm(form, {
          name: { required: true, minLength: 3 },
          email: { required: true, email: true },
          phone: { required: true, phone: true },
          password: { required: true, password: true },
          confirmPassword: {
            required: true,
            custom: (value) =>
              value === document.getElementById("password").value,
            customMessage: "As senhas não coincidem",
          },
        });

        if (!isValid) {
          UI.showAlert("Por favor, corrija os erros no formulário.", "error");
          return;
        }

        // Coletar dados
        const formData = new FormData(form);
        const userData = {
          name: formData.get("name").trim(),
          email: formData.get("email").trim(),
          phone: formData.get("phone").trim(),
          password: formData.get("password"),
          type: "client",
        };

        console.log("📤 Dados que serão enviados:", userData);
        console.log("📱 Telefone (salvo localmente):", phone);

        try {
          UI.showLoading("Criando sua conta...");

          // Registrar usuário
          console.log("🚀 Iniciando registro...");
          const response = await Auth.register(userData);
          console.log("✅ Resposta recebida:", response);

          UI.hideLoading();
          UI.showAlert(
            "Conta criada com sucesso! Redirecionando...",
            "success"
          );

          // Redirecionar para dashboard
          setTimeout(() => {
            window.location.href = "./client-dashboard.html";
          }, 1500);
        } catch (error) {
          UI.hideLoading();
          console.error("❌ Erro ao cadastrar:", error);

          // Mensagens de erro mais específicas
          let errorMessage = "Erro ao criar conta. Tente novamente.";

          if (error.message) {
            if (error.message.includes("já cadastrado")) {
              errorMessage =
                "Este e-mail já está cadastrado. Tente fazer login ou use outro e-mail.";
            } else if (error.message.includes("Failed to fetch")) {
              errorMessage =
                "Não foi possível conectar ao servidor. Verifique sua conexão ou tente novamente mais tarde.";
            } else {
              errorMessage = error.message;
            }
          }

          UI.showAlert(errorMessage, "error");
        }
      });
    </script>
  </body>
</html>
