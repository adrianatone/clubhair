<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços - ClubHair</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="./client-dashboard.html" class="navbar-logo">
        <img src="../../assets/images/logo.png" alt="Logo"><span>ClubHair</span>
      </a>
      <div class="navbar-menu">
        <a href="./client-dashboard.html" class="navbar-link"><i class="fas fa-home"></i> Início</a>
        <a href="./client-barbershops.html" class="navbar-link"><i class="fas fa-store"></i> Barbearias</a>
        <a href="./client-appointments.html" class="navbar-link"><i class="fas fa-calendar"></i> Agendamentos</a>
        <button id="logoutBtn" class="btn btn-sm btn-outline"><i class="fas fa-sign-out-alt"></i> Sair</button>
      </div>
    </div>
  </nav>
  <main style="padding: 2rem; min-height: 100vh; background: var(--background-color);">
    <div style="max-width: 1024px; margin: 0 auto;">
      <header style="margin-bottom: 2rem;">
        <button onclick="history.back()" class="btn btn-outline">
          <i class="fas fa-arrow-left"></i> Voltar
        </button>
        <h1 id="barbershopName" style="margin: 1rem 0;">Serviços</h1>
      </header>
      <div id="servicesGrid" style="display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>
    </div>
  </main>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>
    if (!Auth.isAuthenticated() || !Auth.isClient()) window.location.href = './client-login.html';
    document.getElementById('logoutBtn').addEventListener('click', () => {
      UI.confirmModal('Confirmar Saída', 'Tem certeza?', () => Auth.logout('../../index.html'));
    });
    const params = new URLSearchParams(window.location.search);
    const barbershopId = params.get('barbershopId');
    if (!barbershopId) {
      UI.showAlert('Barbearia não encontrada.', 'error');
      setTimeout(() => window.location.href = './client-barbershops.html', 2000);
    }
    async function loadServices() {
      try {
        UI.showLoading('Carregando serviços...');
        const barbershopData = await API.getBarbershop(barbershopId);
        document.getElementById('barbershopName').textContent = `Serviços - ${barbershopData.name}`;
        const servicesData = await API.getServicesByBarbershop(barbershopId);
        UI.hideLoading();
        const grid = document.getElementById('servicesGrid');
        if (!servicesData.services || servicesData.services.length === 0) {
          UI.renderEmptyState(grid, 'Nenhum serviço disponível nesta barbearia.', 'fa-cut');
          return;
        }
        grid.innerHTML = '';
        servicesData.services.forEach(service => {
          const card = Utils.createElement('article', { className: 'card' }, `
            <h3>${Utils.escapeHtml(service.name)}</h3>
            <p><i class="fas fa-dollar-sign"></i> ${Utils.formatCurrency(service.price)}</p>
            <p><i class="fas fa-clock"></i> ${service.duration} minutos</p>
            <button class="btn btn-primary btn-block" onclick="window.location.href='./client-booking.html?barbershopId=${barbershopId}&serviceId=${service.id}'">
              <i class="fas fa-calendar-plus"></i> Agendar
            </button>
          `);
          grid.appendChild(card);
        });
      } catch (error) {
        UI.hideLoading();
        console.error('Erro:', error);
        UI.showAlert('Erro ao carregar serviços.', 'error');
      }
    }
    loadServices();
  </script>
</body>
</html>
