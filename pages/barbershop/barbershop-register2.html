<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../assets/css/barbershop-register2.css" />
    <title>Cadastro de dados da Barbearia</title>
  </head>
  <body>
    <div class="login-container">
      <h2>Cadastro de dados da Barbearia</h2>

      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="name" placeholder="Nome da Barbearia" />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" placeholder="Telefone para contato" maxlength="15" />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-map-location-dot"></i>
        <input type="adress" placeholder="Endereço completo" />
      </div>

      <button class="login-button">Cadastrar</button>
    </div>

    <script
      src="https://kit.fontawesome.com/058fc3bd0d.js"
      crossorigin="anonymous"
    ></script>
    <script src="../../assets/js/barbershop-register2.js"></script>
  </body>
</html>
