<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ClubHair - Sistema de Agendamento e Gestão para Barbearias">
  <title>ClubHair - Bem-vindo</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Estilos específicos da página inicial */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--secondary-color) 0%, var(--secondary-dark) 100%);
    }
    
    .home-container {
      background-color: var(--surface-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: var(--spacing-2xl);
      max-width: 600px;
      width: 90%;
      text-align: center;
    }
    
    .logo-section {
      margin-bottom: var(--spacing-2xl);
    }
    
    .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }
    
    .logo-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--primary-color), transparent);
    }
    
    .logo-image {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    
    .site-title {
      font-size: var(--text-3xl);
      font-weight: 700;
      color: var(--primary-color);
      margin: 0;
      letter-spacing: 2px;
    }
    
    .site-subtitle {
      color: var(--text-secondary);
      margin-top: var(--spacing-sm);
      font-size: var(--text-base);
    }
    
    .options-container {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: var(--spacing-lg);
      align-items: center;
      margin-top: var(--spacing-2xl);
    }
    
    .option-section {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }
    
    .option-title {
      font-size: var(--text-xl);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
    }
    
    .option-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    
    .option-btn {
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      font-weight: 600;
      transition: all var(--transition-base);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      text-decoration: none;
    }
    
    .option-btn-client {
      background-color: var(--primary-color);
      color: white;
      border: 2px solid var(--primary-color);
    }
    
    .option-btn-client:hover {
      background-color: var(--primary-dark);
      color: var(--secondary-dark);
      border-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .option-btn-barbershop {
      background-color: var(--secondary-color);
      color: white;
      border: 2px solid var(--secondary-color);
    }
    
    .option-btn-barbershop:hover {
      background-color: var(--secondary-dark);
      border-color: var(--secondary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, var(--primary-color), transparent);
    }
    
    .divider::before {
      top: -50px;
    }
    
    .divider::after {
      bottom: -50px;
    }
    
    .divider-text {
      background-color: var(--primary-color);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--text-lg);
    }
    
    .footer-text {
      margin-top: var(--spacing-2xl);
      color: var(--text-secondary);
      font-size: var(--text-sm);
    }
    
    /* Responsividade */
    @media (max-width: 768px) {
      .home-container {
        padding: var(--spacing-lg);
      }
      
      .options-container {
        grid-template-columns: 1fr;
        gap: var(--spacing-xl);
      }
      
      .divider {
        transform: rotate(90deg);
      }
      
      .divider::before,
      .divider::after {
        width: 40px;
        height: 2px;
      }
      
      .divider::before {
        top: 0;
        left: -50px;
      }
      
      .divider::after {
        bottom: 0;
        right: -50px;
      }
      
      .option-buttons {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <!-- Skip to main content para acessibilidade -->
  <a href="#main" class="skip-link">Pular para o conteúdo principal</a>
  
  <main id="main" class="home-container" role="main">
    <!-- Logo e título -->
    <header class="logo-section">
      <div class="logo-wrapper">
        <div class="logo-line" aria-hidden="true"></div>
        <img 
          src="./assets/images/logo.png" 
          alt="Logo ClubHair" 
          class="logo-image"
        >
        <div class="logo-line" aria-hidden="true"></div>
      </div>
      <h1 class="site-title">CLUB HAIR</h1>
      <p class="site-subtitle">Sistema de Agendamento para Barbearias</p>
    </header>
    
    <!-- Opções de acesso -->
    <section class="options-container">
      <!-- Opção Cliente -->
      <div class="option-section">
        <h2 class="option-title">Sou Cliente</h2>
        <div class="option-buttons">
          <a 
            href="./pages/client/client-login.html" 
            class="option-btn option-btn-client"
            aria-label="Entrar como cliente"
          >
            <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
            Entrar
          </a>
          <a 
            href="./pages/client/client-register.html" 
            class="option-btn option-btn-client"
            aria-label="Cadastrar-se como cliente"
          >
            <i class="fas fa-user-plus" aria-hidden="true"></i>
            Cadastrar
          </a>
        </div>
      </div>
      
      <!-- Divider -->
      <div class="divider" aria-hidden="true">
        <span class="divider-text">OU</span>
      </div>
      
      <!-- Opção Barbearia -->
      <div class="option-section">
        <h2 class="option-title">Sou Barbearia</h2>
        <div class="option-buttons">
          <a 
            href="./pages/barbershop/barbershop-login.html" 
            class="option-btn option-btn-barbershop"
            aria-label="Entrar como barbearia"
          >
            <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
            Entrar
          </a>
          <a 
            href="./pages/barbershop/barbershop-register.html" 
            class="option-btn option-btn-barbershop"
            aria-label="Cadastrar-se como barbearia"
          >
            <i class="fas fa-store" aria-hidden="true"></i>
            Cadastrar
          </a>
        </div>
      </div>
    </section>
    
    <!-- Footer -->
    <footer class="footer-text">
      <p>&copy; 2024 ClubHair. Sistema de agendamento profissional.</p>
    </footer>
  </main>
</body>
</html>
