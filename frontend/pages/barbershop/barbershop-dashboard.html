<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dashboard da Barbearia - ClubHair" />
  <title>Dashboard - ClubHair</title>
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .action-card {
      background: var(--surface-color);
      padding: 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      text-decoration: none;
      color: var(--text-primary);
      text-align: center;
      transition: all var(--transition-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .action-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-xl);
      color: var(--text-primary);
    }

    .action-card:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 4px;
    }

    .action-icon {
      width: 60px;
      height: 60px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Pular para o conteúdo principal</a>

  <nav class="navbar" role="navigation" aria-label="Navegação principal">
    <div class="navbar-container">
      <a href="./barbershop-dashboard.html" class="navbar-logo" aria-label="ClubHair - Ir para início">
        <img src="../../assets/images/logo.png" alt="" aria-hidden="true" />
        <span>ClubHair</span>
      </a>
      <button class="navbar-hamburger" aria-expanded="false" aria-controls="navbar-menu" aria-label="Abrir menu" type="button">
        <span class="hamburger-line" aria-hidden="true"></span>
        <span class="hamburger-line" aria-hidden="true"></span>
        <span class="hamburger-line" aria-hidden="true"></span>
      </button>
      <div class="navbar-menu" id="navbar-menu">
        <a href="./barbershop-dashboard.html" class="navbar-link active" aria-current="page"><i class="fas fa-home" aria-hidden="true"></i> Início</a>
        <a href="./barbershop-services.html" class="navbar-link"><i class="fas fa-cut" aria-hidden="true"></i> Serviços</a>
        <a href="./barbershop-appointments.html" class="navbar-link"><i class="fas fa-calendar" aria-hidden="true"></i> Agendamentos</a>
        <a href="./barbershop-profile.html" class="navbar-link"><i class="fas fa-user" aria-hidden="true"></i> Perfil</a>
        <button id="logoutBtn" class="btn btn-sm btn-outline" type="button">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sair
        </button>
      </div>
    </div>
  </nav>

  <main id="main" style="padding: 2rem; min-height: 100vh; background: var(--background-color);">
    <div style="max-width: 1024px; margin: 0 auto;">
      <section
        style="background: linear-gradient(135deg, var(--secondary-color), var(--secondary-dark)); color: white; padding: 2rem; border-radius: var(--radius-lg); margin-bottom: 2rem;"
        aria-labelledby="welcome-heading"
      >
        <h1 id="welcome-heading" style="font-size: 2rem; margin-bottom: 0.5rem;">
          Bem-vindo, <span id="userName"></span>!
        </h1>
        <p id="barbershopName" style="font-size: 1.125rem; opacity: 0.9;"></p>
      </section>

      <nav aria-label="Ações rápidas">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
          <a href="./barbershop-services.html" class="action-card">
            <div class="action-icon" aria-hidden="true"><i class="fas fa-cut"></i></div>
            <h2 style="font-size: 1.125rem; font-weight: 600; margin: 0;">Gerenciar Serviços</h2>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0;">Adicione e gerencie os serviços da sua barbearia</p>
          </a>

          <a href="./barbershop-appointments.html" class="action-card">
            <div class="action-icon" aria-hidden="true"><i class="fas fa-calendar-check"></i></div>
            <h2 style="font-size: 1.125rem; font-weight: 600; margin: 0;">Ver Agendamentos</h2>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0;">Confirme, complete ou cancele agendamentos</p>
          </a>

          <a href="./barbershop-profile.html" class="action-card">
            <div class="action-icon" aria-hidden="true"><i class="fas fa-store"></i></div>
            <h2 style="font-size: 1.125rem; font-weight: 600; margin: 0;">Perfil da Barbearia</h2>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0;">Atualize informações da barbearia</p>
          </a>
        </div>
      </nav>
    </div>
  </main>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>
    if (!Auth.isAuthenticated() || !Auth.isBarbershop()) {
      window.location.href = './barbershop-login.html';
    }

    UI.initMobileNav();

    const user = Auth.getUser();
    document.getElementById('userName').textContent = user.name;

    async function loadBarbershopInfo() {
      try {
        const data = await API.getBarbershopByUserId(user.id);
        if (data.barbershop) {
          document.getElementById('barbershopName').textContent = data.barbershop.name;
        }
      } catch (error) {
        console.error('Erro ao carregar barbearia:', error);
      }
    }

    loadBarbershopInfo();

    document.getElementById('logoutBtn').addEventListener('click', () => {
      UI.confirmModal('Confirmar Saída', 'Tem certeza?', () => Auth.logout('../../index.html'));
    });
  </script>
</body>
</html>
