<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gerenciar Agendamentos - ClubHair" />
  <title>Agendamentos - ClubHair</title>
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <a href="#main" class="skip-link">Pular para o conteúdo principal</a>

  <nav class="navbar" role="navigation" aria-label="Navegação principal">
    <div class="navbar-container">
      <a href="./barbershop-dashboard.html" class="navbar-logo" aria-label="ClubHair - Ir para início">
        <img src="../../assets/images/logo.png" alt="" aria-hidden="true" />
        <span>ClubHair</span>
      </a>
      <button
        class="navbar-hamburger"
        aria-expanded="false"
        aria-controls="navbar-menu"
        aria-label="Abrir menu de navegação"
        type="button"
      >
        <span class="hamburger-line" aria-hidden="true"></span>
        <span class="hamburger-line" aria-hidden="true"></span>
        <span class="hamburger-line" aria-hidden="true"></span>
      </button>
      <div class="navbar-menu" id="navbar-menu">
        <a href="./barbershop-dashboard.html" class="navbar-link"><i class="fas fa-home" aria-hidden="true"></i> Início</a>
        <a href="./barbershop-services.html" class="navbar-link"><i class="fas fa-cut" aria-hidden="true"></i> Serviços</a>
        <a href="./barbershop-appointments.html" class="navbar-link active" aria-current="page"><i class="fas fa-calendar" aria-hidden="true"></i> Agendamentos</a>
        <a href="./barbershop-profile.html" class="navbar-link"><i class="fas fa-user" aria-hidden="true"></i> Perfil</a>
        <button id="logoutBtn" class="btn btn-sm btn-outline" type="button">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sair
        </button>
      </div>
    </div>
  </nav>

  <main id="main" style="padding: 2rem; min-height: 100vh; background: var(--background-color);">
    <div style="max-width: 1200px; margin: 0 auto;">
      <header style="margin-bottom: 2rem;">
        <h1>Gerenciar Agendamentos</h1>
        <p>Confirme, complete ou cancele agendamentos</p>
      </header>
      <div id="appointmentsList" aria-live="polite" aria-busy="true"></div>
    </div>
  </main>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>
    if (!Auth.isAuthenticated() || !Auth.isBarbershop()) {
      window.location.href = './barbershop-login.html';
    }

    UI.initMobileNav();

    document.getElementById('logoutBtn').addEventListener('click', () => {
      UI.confirmModal('Confirmar Saída', 'Tem certeza?', () =>
        Auth.logout('../../index.html')
      );
    });

    const user = Auth.getUser();

    async function loadAppointments() {
      const container = document.getElementById('appointmentsList');
      container.setAttribute('aria-busy', 'true');

      try {
        UI.showLoading('Carregando agendamentos...');
        const barbershopData = await API.getBarbershopByUserId(user.id);

        /**
         * CORREÇÃO N+1: o endpoint /schedules/barbershop/:id já retorna User e Service
         * aninhados. Usamos esses dados diretamente em vez de fazer requisições extras.
         */
        const appointmentsData = await API.getSchedulesByBarbershop(barbershopData.barbershop.id);
        UI.hideLoading();
        container.setAttribute('aria-busy', 'false');

        if (!appointmentsData.schedules || appointmentsData.schedules.length === 0) {
          UI.renderEmptyState(container, 'Nenhum agendamento encontrado.', 'fa-calendar');
          return;
        }

        container.innerHTML = `
          <div class="table-container">
            <table class="table" aria-label="Lista de agendamentos da barbearia">
              <thead>
                <tr>
                  <th scope="col">Data</th>
                  <th scope="col">Hora</th>
                  <th scope="col">Cliente</th>
                  <th scope="col">Serviço</th>
                  <th scope="col">Status</th>
                  <th scope="col">Ações</th>
                </tr>
              </thead>
              <tbody id="appointmentsBody"></tbody>
            </table>
          </div>
        `;

        const tbody = document.getElementById('appointmentsBody');

        appointmentsData.schedules.forEach(appointment => {
          const row = document.createElement('tr');

          // Dados aninhados já vêm na resposta — sem requisições extras
          const clientName = appointment.User
            ? appointment.User.name
            : `Cliente #${appointment.clientId}`;

          const serviceName = appointment.Service
            ? appointment.Service.name
            : `Serviço #${appointment.serviceId}`;

          // Ações disponíveis por status
          const actions = [];

          if (appointment.status === 'pending') {
            actions.push(`
              <button
                class="btn btn-sm btn-success"
                onclick="updateStatus(${appointment.id}, 'confirmed')"
                aria-label="Confirmar agendamento de ${Utils.escapeHtml(clientName)}"
                type="button"
              >
                <i class="fas fa-check" aria-hidden="true"></i>
              </button>
              <button
                class="btn btn-sm btn-error"
                onclick="updateStatus(${appointment.id}, 'canceled')"
                aria-label="Cancelar agendamento de ${Utils.escapeHtml(clientName)}"
                type="button"
              >
                <i class="fas fa-times" aria-hidden="true"></i>
              </button>
            `);
          } else if (appointment.status === 'confirmed') {
            actions.push(`
              <button
                class="btn btn-sm btn-info"
                onclick="updateStatus(${appointment.id}, 'completed')"
                aria-label="Concluir agendamento de ${Utils.escapeHtml(clientName)}"
                type="button"
              >
                <i class="fas fa-check-double" aria-hidden="true"></i> Concluir
              </button>
              <button
                class="btn btn-sm btn-error"
                onclick="updateStatus(${appointment.id}, 'canceled')"
                aria-label="Cancelar agendamento de ${Utils.escapeHtml(clientName)}"
                type="button"
              >
                <i class="fas fa-times" aria-hidden="true"></i>
              </button>
            `);
          }

          row.innerHTML = `
            <td data-label="Data">${Utils.formatDate(appointment.date)}</td>
            <td data-label="Hora">${Utils.formatTime(appointment.time)}</td>
            <td data-label="Cliente">${Utils.escapeHtml(clientName)}</td>
            <td data-label="Serviço">${Utils.escapeHtml(serviceName)}</td>
            <td data-label="Status">
              <span class="badge ${Utils.getStatusClass(appointment.status)}">
                ${Utils.getStatusText(appointment.status)}
              </span>
            </td>
            <td data-label="Ações">
              <div class="table-actions">
                ${actions.length > 0 ? actions.join('') : '<span style="color: var(--text-light);">—</span>'}
              </div>
            </td>
          `;

          tbody.appendChild(row);
        });

      } catch (error) {
        UI.hideLoading();
        container.setAttribute('aria-busy', 'false');
        console.error('Erro:', error);
        UI.showAlert('Erro ao carregar agendamentos.', 'error');
      }
    }

    async function updateStatus(scheduleId, newStatus) {
      const statusLabels = {
        confirmed: 'confirmar',
        completed: 'concluir',
        canceled: 'cancelar'
      };

      UI.confirmModal(
        `${Utils.capitalize(statusLabels[newStatus])} Agendamento`,
        `Tem certeza que deseja ${statusLabels[newStatus]} este agendamento?`,
        async () => {
          try {
            UI.showLoading('Atualizando...');
            await API.updateScheduleStatus(scheduleId, newStatus);
            UI.hideLoading();
            UI.showAlert('Agendamento atualizado com sucesso!', 'success');
            loadAppointments();
          } catch (error) {
            UI.hideLoading();
            console.error('Erro:', error);
            UI.showAlert(error.message || 'Erro ao atualizar agendamento.', 'error');
          }
        }
      );
    }

    loadAppointments();
  </script>
</body>
</html>
