<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login de Cliente - ClubHair" />
  <title>Login de Cliente - ClubHair</title>
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--spacing-md);
    }

    .login-container {
      background-color: var(--surface-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--spacing-2xl);
      max-width: 450px;
      width: 100%;
    }

    @media (max-width: 480px) {
      .login-container { padding: var(--spacing-lg); }
    }

    .login-header { text-align: center; margin-bottom: var(--spacing-xl); }

    .login-footer {
      text-align: center;
      margin-top: var(--spacing-lg);
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--background-color);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .login-footer a { color: var(--primary-color); font-weight: 600; }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Pular para o conteúdo principal</a>

  <main id="main" class="login-container">
    <a href="../../index.html" class="back-link">
      <i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar
    </a>

    <header class="login-header">
      <img src="../../assets/images/logo.png" alt="Logo ClubHair" style="width: 60px; height: 60px; margin: 0 auto var(--spacing-md);" />
      <h1>Login de Cliente</h1>
      <p style="color: var(--text-secondary); font-size: var(--text-sm);">Entre com suas credenciais</p>
    </header>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email" class="form-label required">Email</label>
        <div class="input-group">
          <i class="fas fa-envelope input-group-icon" aria-hidden="true"></i>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="seu@email.com"
            autocomplete="email"
            required
            aria-required="true"
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label required">Senha</label>
        <div class="input-group">
          <i class="fas fa-lock input-group-icon" aria-hidden="true"></i>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
            aria-required="true"
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Entrar
      </button>
    </form>

    <footer class="login-footer">
      <p>Não tem uma conta? <a href="./client-register.html">Cadastre-se</a></p>
    </footer>
  </main>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>
    if (Auth.isAuthenticated() && Auth.isClient()) {
      window.location.href = './client-dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const isValid = UI.validateForm(e.target, {
        email:    { required: true, email: true },
        password: { required: true }
      });

      if (!isValid) {
        UI.showAlert('Por favor, preencha todos os campos corretamente.', 'error');
        return;
      }

      const formData = new FormData(e.target);
      const email    = formData.get('email').trim();
      const password = formData.get('password');

      try {
        UI.showLoading('Entrando...');
        const response = await Auth.login(email, password);

        if (!Auth.isClient()) {
          Auth.logout();
          throw new Error('Esta área é exclusiva para clientes. Use o login de barbearia.');
        }

        UI.hideLoading();
        UI.showAlert(`Bem-vindo, ${response.user.name}!`, 'success');
        setTimeout(() => (window.location.href = './client-dashboard.html'), 1000);

      } catch (error) {
        UI.hideLoading();
        console.error('Erro ao fazer login:', error);
        UI.showAlert(error.message || 'Email ou senha inválidos.', 'error');
      }
    });
  </script>
</body>
</html>
